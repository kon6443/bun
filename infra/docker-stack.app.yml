version: '3.9'

services:
  app:
    image: ${REGISTRY_URL}/prod_nest:${IMAGE_TAG}
    networks:
      - sys_default
    env_file:
      - /home/ubuntu/desktop/deploy/sys/config/env/.env
    environment:
      TASK_SLOT: "{{.Task.Slot}}"
    ports:
      - target: 3500
        published: 23500
        mode: ingress
    volumes:
      - /home/ubuntu/desktop/deploy/sys/config/oracle:/opt/oracle
      - /home/ubuntu/desktop/deploy/sys/shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3500/api/v1/health-check"]
      # 롤백 판정이 작동하려면 unhealthy 판정 시간이 update_config.monitor(90s)보다 짧아야 한다. 값을 바꾸면 monitor도 같이 맞춘다.
      # healthy 전 실패는 업데이트 실패로 바로 잡히고, monitor는 healthy 뒤 다시 죽는 경우(최대 retries × (interval + timeout) = 45s)를 본다.
      # monitor를 태스크 시작부터 세는 경우의 최악(start_period 포함 85s)까지 덮도록 90s로 둔다 (docs/tasks/ci-deploy-speed-2026-10)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.labels.prod_nest == 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 90s   # healthcheck 판정 시간보다 길게(위 healthcheck 주석) — 헬스체크 실패도 롤백으로 잡는다
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 5s
        max_failure_ratio: 0
      restart_policy:
        # any — unhealthy로 내려진 컨테이너는 graceful shutdown(SIGTERM → exit 0, src/main.ts)으로 끝나 Completed가 된다.
        # on-failure는 Completed를 재시작하지 않아(swarmkit restart.go shouldRestart) 레플리카가 다음 배포까지 빠진 채 남는다
        condition: any
        # 재시작 횟수 상한(max_attempts)은 두지 않는다 — 헬스체크가 DB ping이라, DB 장애 중 상한에 닿으면
        # Swarm이 태스크를 포기해 DB 복구 후에도 서비스가 내려간 채 남는다. 크래시 루프는 간격으로만 늦춘다.
        delay: 10s

networks:
  sys_default:
    external: true
