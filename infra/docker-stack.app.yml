version: '3.9'

services:
  app:
    image: ${REGISTRY_URL}/prod_nest:${IMAGE_TAG}
    networks:
      - sys_default
    env_file:
      - /home/ubuntu/desktop/deploy/sys/config/env/.env
    environment:
      TASK_SLOT: "{{.Task.Slot}}"
    ports:
      - target: 3500
        published: 23500
        mode: ingress
    volumes:
      - /home/ubuntu/desktop/deploy/sys/config/oracle:/opt/oracle
      - /home/ubuntu/desktop/deploy/sys/shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3500/api/v1/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.labels.prod_nest == 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 60s   # 헬스체크 간격(30s)보다 길게 — 뜬 직후 곧 죽는 태스크도 롤백 판정에 잡는다
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 5s
        max_failure_ratio: 0
      restart_policy:
        condition: on-failure
        # 재시작 횟수 상한(max_attempts)은 두지 않는다 — 헬스체크가 DB ping이라, DB 장애 중 상한에 닿으면
        # Swarm이 태스크를 포기해 DB 복구 후에도 서비스가 내려간 채 남는다. 크래시 루프는 간격으로만 늦춘다.
        delay: 10s

networks:
  sys_default:
    external: true
