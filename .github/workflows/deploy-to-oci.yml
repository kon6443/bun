name: Deploy NestJS to Docker Swarm

on:
  push:
    branches:
      - main
    # paths (whitelist) — 앱 빌드·배포에 직접 영향 주는 파일만 명시.
    # paths-ignore 는 merge commit 평가 시 예측이 어려워 의도 외 트리거가 발생함.
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'infra/docker-stack.app.yml'
      - '.github/workflows/deploy-to-oci.yml'
      - '.github/workflows/deploy-prod-nest.yml'

permissions:
  contents: read

# 운영 배포는 한 번에 하나만 — main에 연달아 머지되면 앞 배포가 끝난 뒤 다음이 돈다.
# 진행 중인 배포는 취소하지 않는다(스택 반영 중 끊기면 서비스가 반쯤 바뀐 채 남는다).
# 대기 중이던 배포는 더 새 배포가 오면 GitHub가 대체한다 — 최신 커밋만 반영되면 충분하다.
# 수동 롤백(rollback-prod-nest.yml)도 같은 그룹이라, 롤백을 실행하면 대기 중이던 push 배포가 취소된다(그 반대도 같다).
concurrency:
  group: deploy-prod-nest
  cancel-in-progress: false

jobs:
  # 배포 전 검증 게이트 — 같은 SHA를 검증한 뒤에만 배포한다 (docs/tasks/backend-audit-2026-10 D-010)
  ci:
    uses: ./.github/workflows/ci.yml

  # 이미지 빌드는 ci와 병렬로 돈다 — push만 하고 배포는 deploy가 ci 통과 뒤에 한다.
  # 검증 실패 커밋의 이미지가 레지스트리에 남을 수 있지만 스택에는 반영되지 않는다.
  # prod_nest는 ARM64 노드(fs-01)에만 배치된다 — QEMU 멀티아치 대신 네이티브 ARM 러너로 arm64만 빌드한다
  # (docs/tasks/ci-deploy-speed-2026-10)
  build:
    runs-on: ubuntu-24.04-arm
    # 레지스트리 시크릿이 prod 환경 범위라 빌드 잡도 같은 환경을 쓴다
    environment: prod
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # 잡 종료 시 builder 제거(실측 14s)를 건너뛴다 — GitHub 호스티드 러너는 잡이 끝나면 통째로 폐기된다
          cleanup: false

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and Push arm64 image
        uses: docker/build-push-action@v6
        env:
          # 공개 레포 — 빌드 기록 artifact에는 시크릿 마스킹이 안 되어 레지스트리 주소(태그)가 남을 수 있다
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/prod_nest:${{ steps.sha.outputs.short }}
          provenance: false
          sbom: false
          # PR 빌드(ci-docker.yml)와 같은 scope — PR은 main 캐시를 읽을 수 있다
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  # 스택 반영은 재사용 워크플로가 한다 — 수동 롤백(rollback-prod-nest.yml)과 같은 경로를 쓴다
  deploy:
    needs: [ci, build]
    uses: ./.github/workflows/deploy-prod-nest.yml
    with:
      image_tag: ${{ needs.build.outputs.short_sha }}
    secrets: inherit
