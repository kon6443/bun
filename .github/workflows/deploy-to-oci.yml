name: Deploy NestJS to Docker Swarm

on:
  push:
    branches:
      - main
    # paths (whitelist) — 앱 빌드·배포에 직접 영향 주는 파일만 명시.
    # paths-ignore 는 merge commit 평가 시 예측이 어려워 의도 외 트리거가 발생함.
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'infra/docker-stack.app.yml'
      - '.github/workflows/deploy-to-oci.yml'

permissions:
  contents: read

# 운영 배포는 한 번에 하나만 — main에 연달아 머지되면 앞 배포가 끝난 뒤 다음이 돈다.
# 진행 중인 배포는 취소하지 않는다(스택 반영 중 끊기면 서비스가 반쯤 바뀐 채 남는다).
# 대기 중이던 배포는 더 새 배포가 오면 GitHub가 대체한다 — 최신 커밋만 반영되면 충분하다.
concurrency:
  group: deploy-prod-nest
  cancel-in-progress: false

jobs:
  # 배포 전 검증 게이트 — 같은 SHA를 검증한 뒤에만 배포한다 (docs/tasks/backend-audit-2026-10 D-010)
  ci:
    uses: ./.github/workflows/ci.yml

  # 이미지 빌드는 ci와 병렬로 돈다 — push만 하고 배포는 deploy가 ci 통과 뒤에 한다.
  # 검증 실패 커밋의 이미지가 레지스트리에 남을 수 있지만 스택에는 반영되지 않는다.
  # prod_nest는 ARM64 노드(fs-01)에만 배치된다 — QEMU 멀티아치 대신 네이티브 ARM 러너로 arm64만 빌드한다
  # (docs/tasks/ci-deploy-speed-2026-10)
  build:
    runs-on: ubuntu-24.04-arm
    # 레지스트리 시크릿이 prod 환경 범위라 빌드 잡도 같은 환경을 쓴다
    environment: prod
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and Push arm64 image
        uses: docker/build-push-action@v6
        env:
          # 공개 레포 — 빌드 기록 artifact에는 시크릿 마스킹이 안 되어 레지스트리 주소(태그)가 남을 수 있다
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/prod_nest:${{ steps.sha.outputs.short }}
          provenance: false
          sbom: false
          # PR 빌드(ci-docker.yml)와 같은 scope — PR은 main 캐시를 읽을 수 있다
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  deploy:
    needs: [ci, build]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rsync stack YAML to Swarm manager
        run: |
          echo "${{ secrets.SWARM_MANAGER_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          rsync -avz \
            -e "ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no" \
            infra/docker-stack.app.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER }}:/home/ubuntu/desktop/deploy/infra/prod_nest.yml
          rm /tmp/ssh_key

      - name: Deploy stack via SSH (converge 동기 대기)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          # 실패 전파는 스크립트의 set -euo pipefail과 마지막 exit "$FAILED"로 통일한다.
          # command_timeout 기본값은 10m이라 아래 15분 상한(timeout 900)보다 짧다 — 판정·진단 출력이 잘리지 않게 늘린다.
          command_timeout: 20m
          script: |
            set -euo pipefail
            export REGISTRY_URL=${{ secrets.REGISTRY_URL }}
            export IMAGE_TAG=${{ needs.build.outputs.short_sha }}
            STACK=prod_nest
            DEPLOY_STARTED=$(date -u +%s)

            # 수렴(헬스체크 통과)까지 기다린다. 전체 상한 15분 — 넘기면 실패로 본다
            DEPLOY_FAILED=0
            timeout 900 docker stack deploy --detach=false \
              -c /home/ubuntu/desktop/deploy/infra/prod_nest.yml \
              --with-registry-auth \
              "$STACK" || DEPLOY_FAILED=1

            # Swarm 판정 — --detach=false는 수렴을 기다리지만, 롤백으로 끝났을 때의 종료코드를 Docker 버전과
            # 무관하게 보장하지 않는다. 그래서 이번 배포 이후 시작된 업데이트의 최종 상태를 서비스별로 확인한다.
            # completed=성공 / 이번 배포에서 업데이트가 없었던 서비스는 건너뜀 / 그 외(rollback_*·paused)=실패
            # CLI가 반환한 직후에는 swarm이 아직 updating으로 보일 수 있어, 진행 중 상태는 상한 안에서 다시 본다.
            # StartedAt이 비어 있으면 0으로 읽어 "업데이트 없음"으로 본다 (nil 역참조로 템플릿이 실패해 오판하지 않게)
            FAILED=$DEPLOY_FAILED
            DEADLINE=$((DEPLOY_STARTED + 900))
            for SVC in $(docker stack services "$STACK" --format '{{.Name}}'); do
              while :; do
                INFO=$(docker service inspect "$SVC" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}} {{if .UpdateStatus.StartedAt}}{{.UpdateStatus.StartedAt.Unix}}{{else}}0{{end}}{{end}}') \
                  || { echo "$SVC: inspect 실패"; FAILED=1; break; }
                STATE=${INFO%% *}
                STARTED=${INFO##* }
                if [ -z "$INFO" ] || [ "$STARTED" -lt "$DEPLOY_STARTED" ]; then
                  echo "$SVC: 이번 배포에서 업데이트 없음"
                  break
                fi
                case "$STATE" in
                  completed)
                    echo "$SVC: completed"
                    break ;;
                  updating|rollback_started)
                    if [ "$(date -u +%s)" -ge "$DEADLINE" ]; then
                      echo "배포 실패: $SVC 대기 상한 초과 (상태 $STATE)"
                      docker service ps "$SVC" --no-trunc | head -20 || true
                      FAILED=1
                      break
                    fi
                    sleep 5 ;;
                  *)
                    echo "배포 실패: $SVC 업데이트 상태 $STATE"
                    docker service ps "$SVC" --no-trunc | head -20 || true
                    FAILED=1
                    break ;;
                esac
              done
            done

            docker stack services "$STACK"
            exit "$FAILED"
