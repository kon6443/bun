name: Deploy prod_nest stack (reusable)

# 운영 스택 반영 — 이미지 태그를 받아 스택 YAML을 보내고 수렴(헬스체크 통과)까지 확인한다.
# 호출: deploy-to-oci.yml(main push, 새로 빌드한 태그) · rollback-prod-nest.yml(수동, 레지스트리의 기존 태그)
# concurrency는 호출하는 워크플로에만 둔다 — 여기에 같은 그룹을 두면 호출한 실행이 그룹을 잡은 채
# 이 워크플로를 기다려 서로 막힌다 (docs/tasks/ci-cd-perf-2026-11)
on:
  workflow_call:
    inputs:
      image_tag:
        description: 배포할 prod_nest 이미지 태그(커밋 SHA 앞 7자리)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      # 태그는 아래 ssh 스크립트에 그대로 보간된다 — 이 step에서 형식(SHA 7자)을 먼저 확인해 셸 주입을 막는다.
      # 검사 자체는 입력을 env로만 다룬다. 이 step이 실패하면 서버에 접속하지 않는다
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "이미지 태그 형식 오류(커밋 SHA 앞 7자리여야 함)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rsync stack YAML to Swarm manager
        run: |
          echo "${{ secrets.SWARM_MANAGER_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          rsync -avz \
            -e "ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no" \
            infra/docker-stack.app.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER }}:/home/ubuntu/desktop/deploy/infra/prod_nest.yml
          rm /tmp/ssh_key

      - name: Deploy stack via SSH (converge 동기 대기)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          # 실패 전파는 스크립트의 set -euo pipefail과 마지막 exit "$FAILED"로 통일한다.
          # command_timeout 기본값은 10m이라 아래 15분 상한(timeout 900)보다 짧다 — 판정·진단 출력이 잘리지 않게 늘린다.
          command_timeout: 20m
          script: |
            set -euo pipefail
            export REGISTRY_URL=${{ secrets.REGISTRY_URL }}
            export IMAGE_TAG=${{ inputs.image_tag }}
            STACK=prod_nest
            DEPLOY_STARTED=$(date -u +%s)

            # 수렴(헬스체크 통과)까지 기다린다. 전체 상한 15분 — 넘기면 실패로 본다
            DEPLOY_FAILED=0
            timeout 900 docker stack deploy --detach=false \
              -c /home/ubuntu/desktop/deploy/infra/prod_nest.yml \
              --with-registry-auth \
              "$STACK" || DEPLOY_FAILED=1

            # Swarm 판정 — --detach=false는 수렴을 기다리지만, 롤백으로 끝났을 때의 종료코드를 Docker 버전과
            # 무관하게 보장하지 않는다. 그래서 이번 배포 이후 시작된 업데이트의 최종 상태를 서비스별로 확인한다.
            # completed=성공 / 이번 배포에서 업데이트가 없었던 서비스는 건너뜀 / 그 외(rollback_*·paused)=실패
            # CLI가 반환한 직후에는 swarm이 아직 updating으로 보일 수 있어, 진행 중 상태는 상한 안에서 다시 본다.
            # StartedAt이 비어 있으면 0으로 읽어 "업데이트 없음"으로 본다 (nil 역참조로 템플릿이 실패해 오판하지 않게)
            FAILED=$DEPLOY_FAILED
            DEADLINE=$((DEPLOY_STARTED + 900))
            for SVC in $(docker stack services "$STACK" --format '{{.Name}}'); do
              while :; do
                INFO=$(docker service inspect "$SVC" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}} {{if .UpdateStatus.StartedAt}}{{.UpdateStatus.StartedAt.Unix}}{{else}}0{{end}}{{end}}') \
                  || { echo "$SVC: inspect 실패"; FAILED=1; break; }
                STATE=${INFO%% *}
                STARTED=${INFO##* }
                if [ -z "$INFO" ] || [ "$STARTED" -lt "$DEPLOY_STARTED" ]; then
                  echo "$SVC: 이번 배포에서 업데이트 없음"
                  break
                fi
                case "$STATE" in
                  completed)
                    echo "$SVC: completed"
                    break ;;
                  updating|rollback_started)
                    if [ "$(date -u +%s)" -ge "$DEADLINE" ]; then
                      echo "배포 실패: $SVC 대기 상한 초과 (상태 $STATE)"
                      docker service ps "$SVC" --no-trunc | head -20 || true
                      FAILED=1
                      break
                    fi
                    sleep 5 ;;
                  *)
                    echo "배포 실패: $SVC 업데이트 상태 $STATE"
                    docker service ps "$SVC" --no-trunc | head -20 || true
                    FAILED=1
                    break ;;
                esac
              done
            done

            docker stack services "$STACK"
            exit "$FAILED"
