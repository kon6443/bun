name: Rollback prod_nest (image tag)

# 수동 롤백 — 레지스트리에 이미 있는 prod_nest 이미지 태그로 다시 배포한다. 빌드·검증 없이 스택 반영만 한다.
# ⚠️ DB 스키마가 바뀐 배포 이전으로 되돌리면 코드와 스키마가 어긋난다. 그 사이에 마이그레이션이 있었다면
#    이 워크플로를 쓰지 말고 revert 커밋으로 배포한다. API 계약이 바뀐 경우 프론트 호환도 먼저 확인한다.
# - 태그는 커밋 SHA 앞 7자리(deploy-to-oci.yml이 붙이는 형식). arm64 단일 이미지만 운영 노드(fs-01)에서 돈다
# - 스택 YAML은 이 워크플로를 실행한 main의 infra/docker-stack.app.yml을 쓴다 — 고른 이미지와 YAML이 맞는지 확인한다
# - 배포 중인 태그를 그대로 넣으면 경로 점검용으로 쓸 수 있다 — 스펙이 같으면 "업데이트 없음"으로 끝날 것으로 보지만 미검증이다.
#   같은 이미지로 롤링 재시작(start-first, 무중단)이 일어날 수도 있다 — 첫 실행에서 확인 (docs/tasks/ci-cd-perf-2026-11)
# (docs/tasks/ci-cd-perf-2026-11)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '되돌릴 prod_nest 이미지 태그 (커밋 SHA 앞 7자리)'
        type: string
        required: true

permissions:
  contents: read

# 운영 배포(deploy-to-oci.yml)와 같은 그룹 — 배포와 롤백이 겹치지 않게 한다. 진행 중인 것은 취소하지 않는다.
# 대기는 그룹당 1개뿐이라 나중에 온 실행이 대기 중이던 실행을 취소한다(롤백 대기 중 main push가 오면 롤백이 취소되고,
# push 배포 대기 중 롤백을 실행하면 그 배포가 취소된다)
concurrency:
  group: deploy-prod-nest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    # 레지스트리 시크릿이 prod 환경 범위다
    environment: prod
    steps:
      # if:로 건너뛰면 성공처럼 보이므로 스텝 안에서 실패시킨다
      - name: main 브랜치에서만 실행
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "롤백은 main에서만 실행한다 (현재 $GITHUB_REF)"
            exit 1
          fi

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "이미지 태그 형식 오류(커밋 SHA 앞 7자리여야 함)"
            exit 1
          fi

      - name: Log in to Docker Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      # 없는 태그로 스택을 바꾸면 태스크가 이미지를 못 받아 롤아웃이 실패한다 — 배포 전에 막는다
      - name: 레지스트리에 이미지가 있는지 확인
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! docker manifest inspect "$REGISTRY_URL/prod_nest:$IMAGE_TAG" > /dev/null; then
            echo "태그가 없거나 레지스트리 접근 실패(위 docker 출력 참고)"
            exit 1
          fi

  deploy:
    needs: guard
    uses: ./.github/workflows/deploy-prod-nest.yml
    with:
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
