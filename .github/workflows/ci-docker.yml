name: CI Docker build

# 컨테이너 빌드 검증 — 로컬 빌드는 레포 전체를 입력으로 써서 Dockerfile COPY 누락을 못 잡는다
# (docs/tasks/tasks-nestjs-improvements.md D36의 실사고). 이미지 입력이 바뀐 PR에서만,
# 단일 아키텍처로 빌드만 하고 push하지 않는다.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/ci-docker.yml'

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (push 없음)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
