# GitHub Actions 버전 갱신 — 월 1회, PR 1개로 묶음, 메이저 업데이트는 제외(필요 시 사람이 직접 올린다)
# 짝 레포(next-bun)와 같은 설정이다
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(ci)"

  # Dockerfile 베이스 이미지(Node 패치 고정) 갱신 — 보안 릴리스를 놓치지 않게 주 1회, 메이저는 제외(LTS 전환은 사람이 결정)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(infra)"
